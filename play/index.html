<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>地图壁纸 · 逐物体建模试玩</title>
<style>
:root{--ink:#eef3f8;--dim:#a6b4c4;--bg:#10151c;--card:#19212c;--line:#2b3746;--acc:#ffb85c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#menu{position:fixed;inset:0;overflow:auto;padding:26px clamp(16px,4vw,48px) 56px;background:var(--bg);z-index:5}
#menu h1{margin:0 0 4px;font-size:22px;letter-spacing:.02em}
#menu p{margin:0 0 20px;color:var(--dim);max-width:70ch}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--acc);outline:none}
.card img{display:block;width:100%;aspect-ratio:12/7;object-fit:cover;background:#0c1016}
.card div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 11px 9px}
.card b{font-size:16px;font-variant-numeric:tabular-nums}
.card span{color:var(--dim);font-size:12px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
#title{position:absolute;left:14px;top:12px;padding:6px 12px;border-radius:9px;background:rgba(12,17,24,.62);backdrop-filter:blur(6px)}
#title b{font-size:17px;margin-right:9px;font-variant-numeric:tabular-nums}
#title span{color:#d5dee8;font-size:12.5px}
#btns{position:absolute;right:12px;top:12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
button{font:inherit;color:var(--ink);background:rgba(12,17,24,.66);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px)}
button:hover{border-color:var(--acc)}
#orig{position:absolute;right:12px;top:58px;width:min(34vw,420px);border-radius:8px;border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 24px rgba(0,0,0,.4)}
#help{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;border-radius:9px;background:rgba(12,17,24,.6);color:#e3eaf2;font-size:12.5px;white-space:nowrap;pointer-events:none;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
#stick{position:absolute;left:26px;bottom:60px;width:120px;height:120px;border-radius:50%;background:rgba(12,17,24,.35);border:1px solid rgba(255,255,255,.3);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.6)}
#jump{position:absolute;right:30px;bottom:74px;width:74px;height:74px;border-radius:50%;font-size:17px}
#loading{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(10,14,20,.9)}
#loading>div{width:min(360px,80vw);text-align:center}
#loading b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
#loading span{color:var(--dim)}
.bar{height:5px;border-radius:3px;background:#26303d;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div id="title"><b id="mapNo"></b><span id="mapInfo"></span></div>
  <div id="btns">
    <button data-act="view" title="快捷键 V">视角：<span id="viewName">第三人称</span></button>
    <button data-act="orig" title="快捷键 P">对照原图</button>
    <button data-act="prev" title="快捷键 [">上一张</button>
    <button data-act="next" title="快捷键 ]">下一张</button>
    <button data-act="menu" title="快捷键 M">地图列表</button>
  </div>
  <img id="orig" alt="原图" hidden>
  <div id="help">WASD / 方向键 移动 · 按住鼠标拖动 转视角 · 滚轮 远近 · 空格 跳 · Shift 跑 · V 换视角 · R 回起点</div>
  <div id="stick" hidden><i></i></div>
  <button id="jump" hidden>跳</button>
</div>
<div id="loading" hidden><div><b id="loadNo"></b><span id="loadText">加载中</span><div class="bar"><i id="loadBar"></i></div></div></div>
<div id="menu">
  <h1>地图壁纸 · 逐物体建模试玩</h1>
  <p id="menuNote">读取地图列表…</p>
  <div id="grid"></div>
</div>

<script type="module">
// Walkable preview of the per-object maps. Nothing is pre-assembled: the page reads maps/<id>/objects.json,

const canvas = $('c');

scene.background = SKY; scene.fog = new THREE.Fog(SKY, 46, 125);

const hemi = new THREE.HemisphereLight(0xe2eeff, 0xa39d8c, 2.15); scene.add(hemi);

const CELL = 0.08, STEP = 0.35, RADIUS = 0.26, GRAV = 14, JUMP = 5.6;
const S = { id: null, list: [], spec: null, world: null, top: null, GW: 0, GD: 0, Wm: 24, Dm: 16, mode: 'third', yaw: 0, pitch: 0.3, dist: 4.4, camD: 4.4, camY: 0,
  P: { x: 0, z: 0, y: 0, vy: 0, ground: true, head: Math.PI, phase: 0, speed: 0 }, spawn: { x: 0, z: 0, yaw: 0 }, keys: new Set(), stick: { x: 0, y: 0 }, jump: false, busy: false, token: 0 };

const hero = new THREE.Group(), limbs = {};

  add(new THREE.SphereGeometry(0.19, 22, 16), mat(0xffd9b5), 0, 1.31, 0);                              // head
  add(new THREE.SphereGeometry(0.2, 22, 12, 0, Math.PI * 2, 0, Math.PI * 0.48), mat(0x3a2c28), 0, 1.335, -0.012); // hair
  add(new THREE.BoxGeometry(0.27, 0.33, 0.15), mat(0x3f6fb4), 0, 0.86, -0.22);                         // pack
  for (const sx of [-1, 1]) {

    const leg = new THREE.Group(); leg.position.set(sx * 0.1, 0.56, 0); hero.add(leg); add(new THREE.CapsuleGeometry(0.075, 0.34, 4, 10), mat(0x33455c), 0, -0.26, 0, leg); limbs['leg' + sx] = leg;
    const arm = new THREE.Group(); arm.position.set(sx * 0.26, 1.02, 0); hero.add(arm); add(new THREE.CapsuleGeometry(0.058, 0.28, 4, 10), mat(0xf07a4a), 0, -0.2, 0, arm); limbs['arm' + sx] = arm;

function rimColour(img) {               // the colour of the ground picture's border, for the plain land around the map

        root.scale.setScalar(s); root.position.set(-(box.min.x + box.max.x) / 2 * s, -box.min.y * s, -(box.min.z + box.max.z) / 2 * s); holder.add(root);

    let count = 0;
    for (const m of models) {
      m.pts = m.o.leafy ? null : samplePoints(m.holder, !m.o.lathe);      // a spun trunk is solid all round, even where gaps between its roots are cut out of the picture
      for (const at of m.o.at) { const [x, z, yaw, s] = place(at, Wm, Dm), inst = m.holder.clone(); inst.position.set(x, 0, z); inst.rotation.y = yaw; inst.scale.setScalar(s); world.add(inst); count++; }
    }
    progress(0.92, '计算可行走区域'); await tick();
    Object.assign(S, buildGrid(models, Wm, Dm), { spec, Wm, Dm, world });
    for (const m of models) m.pts = null;
    scene.add(world); findSpawn(); respawn();
    $('mapNo').textContent = id; $('mapInfo').textContent = models.length + ' 种物体 · ' + count + ' 处摆放';
    $('orig').src = base + S.files.source;
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    $('loading').hidden = true; $('hud').hidden = false; S.busy = false; S.last = performance.now();
  } catch (e) {
    console.error(e); if (token !== S.token) return;
    $('loadText').textContent = '这张地图加载失败：' + e.message; setTimeout(() => { if (token === S.token) showMenu(); }, 1800);
  }
}

// A published copy carries site.json (the map list and the names of its shrunken pictures); the local server answers /api/maps instead.
S.files = { ground: 'refs/ground.png', source: 'source.png', thumb: 'source.png' };
async function loadList(fresh) {
  if (S.list.length && (S.static || !fresh)) return S.list;
  if (S.static === undefined) {
    try { const r = await fetch('./site.json', { cache: 'no-cache' }); if (r.ok) { const j = await r.json(); S.static = true; S.files = j.files; return (S.list = j.maps); } } catch (e) { /* not a published copy */ }
    S.static = false;
  }
  try { S.list = await (await fetch('/api/maps', { cache: 'no-store' })).json(); } catch (e) { /* keep what is there */ }
  return S.list;
}
async function showMenu() {
  S.token++; S.id = null; S.busy = false; disposeWorld();
  $('hud').hidden = true; $('loading').hidden = true; $('menu').hidden = false;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  const list = await loadList(true);
  $('menuNote').textContent = list.length && S.static ? '共 ' + list.length + ' 张' + (list.length < 100 ? '（其余还在制作，会陆续补上）' : '') + '，点一张进去走走。地图原画出自《赛尔号》壁纸，场景里的每个物体都是照原画单独建模、再摆回原位的。' : list.length ? '已建好 ' + list.length + ' / 100 张，点一张进去走走。还在后台生成的地图，刷新本页后会出现。' : '还没有建好的地图。';
  $('grid').innerHTML = list.map(m => '<a class="card" href="#' + m.id + '"><img loading="lazy" decoding="async" alt="" src="../maps/' + m.id + '/' + S.files.thumb + '"><div><b>' + m.id + '</b><span>' + m.objects + ' 种物体 · ' + m.instances + ' 处</span></div></a>').join('');
}
async function route() {
  const id = (location.hash.slice(1) || new URLSearchParams(location.search).get('map') || '');
  if (/^\d{3}$/.test(id)) { await loadList(); if (id !== S.id || (!S.world && !S.busy)) enter(id); }
  else showMenu();
}
window.addEventListener('hashchange', route);
function neighbour(d) { if (!S.list.length || !S.id) return; const k = S.list.findIndex(m => m.id === S.id), n = S.list.length; location.hash = '#' + S.list[((k < 0 ? 0 : k) + d + n) % n].id; }

// ---------- controls ----------
const VIEWS = { third: '第三人称', first: '第一人称', over: '原图机位' };
function setView(m) { S.mode = m; $('viewName').textContent = VIEWS[m]; S.pitch = m === 'first' ? 0 : 0.3; if (m === 'third') S.camD = S.dist; }
function act(a) {
  if (a === 'view') setView(S.mode === 'third' ? 'first' : S.mode === 'first' ? 'over' : 'third');
  else if (a === 'orig') $('orig').hidden = !$('orig').hidden;
  else if (a === 'prev') neighbour(-1); else if (a === 'next') neighbour(1);
  else if (a === 'menu') { location.hash = ''; showMenu(); }
  else if (a === 'respawn') respawn();
}
$('btns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { act(b.dataset.act); b.blur(); } });
const KEYACT = { KeyV: 'view', KeyP: 'orig', BracketLeft: 'prev', BracketRight: 'next', KeyM: 'menu', KeyR: 'respawn' };
window.addEventListener('keydown', e => {
  if (!S.world || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { S.jump = true; e.preventDefault(); return; }
  if (KEYACT[e.code]) { if (!e.repeat) act(KEYACT[e.code]); return; }
  S.keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => S.keys.delete(e.code));
window.addEventListener('blur', () => S.keys.clear());
let look = null, stickId = null, stick0 = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  if (e.pointerType === 'touch') { $('stick').hidden = false; $('jump').hidden = false; }
  if (e.pointerType === 'touch' && stickId === null && e.clientX < innerWidth * 0.42 && e.clientY > innerHeight * 0.35) { stickId = e.pointerId; stick0 = [e.clientX, e.clientY]; return; }
  if (!look) { look = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.classList.add('drag'); }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stickId) { const dx = clamp((e.clientX - stick0[0]) / 52, -1, 1), dy = clamp((e.clientY - stick0[1]) / 52, -1, 1); S.stick.x = dx; S.stick.y = dy; $('stick').firstElementChild.style.transform = 'translate(' + dx * 34 + 'px,' + dy * 34 + 'px)'; return; }
  if (!look || e.pointerId !== look.id || S.mode === 'over') return;
  S.yaw -= (e.clientX - look.x) * 0.0046; S.pitch = clamp(S.pitch + (e.clientY - look.y) * 0.0036, S.mode === 'first' ? -1.25 : -0.12, S.mode === 'first' ? 1.25 : 1.35); look.x = e.clientX; look.y = e.clientY;
});
const release = e => { if (e.pointerId === stickId) { stickId = null; S.stick.x = S.stick.y = 0; $('stick').firstElementChild.style.transform = ''; } if (look && e.pointerId === look.id) { look = null; canvas.classList.remove('drag'); } };
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', e => { e.preventDefault(); if (S.mode === 'third') S.dist = clamp(S.dist * Math.exp(e.deltaY * 0.0012), 1.6, 10); }, { passive: false });
$('jump').addEventListener('pointerdown', e => { e.preventDefault(); S.jump = true; });

// ---------- one frame ----------
function step(dt) {
  const P = S.P, K = S.keys;
  let f = (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0) - (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0) - S.stick.y, r = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0) + S.stick.x;
  const len = Math.hypot(f, r); if (len > 1) { f /= len; r /= len; }
  const yaw = S.mode === 'over' ? 0 : S.yaw, sp = K.has('ShiftLeft') || K.has('ShiftRight') ? 6.2 : 3.4;
  const vx = (-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp, vz = (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp;
  const n = Math.max(1, Math.ceil(Math.hypot(vx, vz) * dt / 0.05)), x0 = P.x, z0 = P.z;
  for (let k = 0; k < n; k++) {
    const dx = vx * dt / n, dz = vz * dt / n;
    if (dx && blockH(P.x + dx, P.z) - P.y <= STEP) P.x += dx;
    if (dz && blockH(P.x, P.z + dz) - P.y <= STEP) P.z += dz;
  }
  const fl = floorH(P.x, P.z);
  if (P.ground) { if (fl < P.y - STEP) { P.ground = false; P.vy = 0; } else P.y = fl; }
  if (S.jump && P.ground) { P.vy = JUMP; P.ground = false; }
  S.jump = false;
  if (!P.ground) { P.vy -= GRAV * dt; P.y += P.vy * dt; if (P.y <= fl) { P.y = fl; P.vy = 0; P.ground = true; } }
  P.speed = Math.hypot(P.x - x0, P.z - z0) / Math.max(dt, 1e-4);
  if (len > 0.05) { const want = Math.atan2(vx, vz); let d = want - P.head; d = Math.atan2(Math.sin(d), Math.cos(d)); P.head += d * Math.min(1, dt * 12); }
  P.phase += P.speed * dt * 2.6;
  const sw = P.ground ? Math.sin(P.phase) * Math.min(1, P.speed / 3) * 0.75 : 0.5;
  limbs['leg-1'].rotation.x = sw; limbs.leg1.rotation.x = -sw; limbs['arm-1'].rotation.x = -sw * 0.8; limbs.arm1.rotation.x = sw * 0.8;
  S.camY += (P.y - S.camY) * Math.min(1, dt * 14);
  hero.position.set(P.x, S.camY + (P.ground ? Math.abs(Math.sin(P.phase)) * 0.035 * Math.min(1, P.speed / 3) : 0), P.z); hero.rotation.y = P.head;
}
function softH(x, z) { const h = gAt(x, z); return h > 90 ? 0 : h; }
function placeCamera(dt) {
  const P = S.P, aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight); let fov = 58;
  if (S.mode === 'first') { fov = 72; camera.position.set(P.x, S.camY + 1.5, P.z); camera.rotation.set(-S.pitch, S.yaw, 0); hero.visible = false; }
  else if (S.mode === 'third') {
    const tx = P.x, ty = S.camY + 1.28, tz = P.z, el = S.pitch, cx = Math.sin(S.yaw) * Math.cos(el), cy = Math.sin(el), cz = Math.cos(S.yaw) * Math.cos(el);
    let d = S.dist;                       // keep solid things out from between the camera and the walker
    for (let k = 1; k <= 28; k++) { const t = S.dist * k / 28, y = ty + cy * t; if (y < 0.12 || softH(tx + cx * t, tz + cz * t) > y - 0.08) { d = Math.max(0.45, S.dist * (k - 1) / 28); break; } }
    S.camD += (d - S.camD) * (d < S.camD ? 1 : Math.min(1, dt * 5));
    camera.position.set(tx + cx * S.camD, ty + cy * S.camD, tz + cz * S.camD); camera.lookAt(tx, ty, tz); hero.visible = S.camD > 0.95;
  } else {                                // the original picture's own view, as in tools/assemble.py
    const phi = Math.atan(clamp(+(S.spec.world.cam_tan || 0.45), 0.35, 0.9)), dist = 25;
    fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(27.2)) / Math.max(aspect, 1.2)));
    camera.position.set(0, 0.8 + dist * Math.sin(phi), dist * Math.cos(phi) - 0.5); camera.lookAt(0, 0.8, -0.5); hero.visible = true;
  }
  if (camera.fov !== fov || camera.aspect !== aspect) { camera.fov = fov; camera.aspect = aspect; camera.updateProjectionMatrix(); }
}
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) renderer.setSize(w, h, false); }
function frame(now) {
  requestAnimationFrame(frame);
  if (!S.world || S.busy) return;
  const dt = Math.min(0.05, Math.max(0.001, (now - (S.last || now)) / 1000)); S.last = now;
  resize(); step(dt); placeCamera(dt); renderer.render(scene, camera);
}
S.api = { enter, setView, respawn, gAt, step, placeCamera, render: () => { resize(); placeCamera(0.016); renderer.render(scene, camera); } };
requestAnimationFrame(frame);
route();
</script>
</body>
